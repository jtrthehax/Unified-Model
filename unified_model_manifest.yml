    layer: 01
    upstream: ["BREATHING"]
    downstream: ["contract_WINDOWS_COG"]
    falsifiable_metric: "BP oscillometric deviation under controlled pressure"

  contract_AUTO_CARDIAC:
    path: "01_PHYSICS_SUBSTRATE_CORE/contract_AUTO_CARDIAC_autonomic_to_cardiac.md"
    layer: 01
    upstream: ["contract_MET_AUTO", "contract_IMMUNE_AUTO"]
    downstream: ["contract_WINDOWS_COG"]
    falsifiable_metric: null

  contract_AUTO_MOD:
    path: "01_PHYSICS_SUBSTRATE_CORE/contract_AUTO_MOD_autonomic_to_modulation.md"
